name: CI

permissions:
  contents: read
  actions: read

env:
  KEELMATRIX_NO_TELEMETRY: "1"

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.424"

      - name: Restore dependencies
        run: dotnet restore KeelMatrix.FixtureVault.sln

      - name: Build Release
        run: dotnet build KeelMatrix.FixtureVault.sln -c Release --no-restore

      - name: Verify formatting
        run: dotnet format KeelMatrix.FixtureVault.sln --verify-no-changes --no-restore

      - name: Test release contract and negative publication guards
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/test-release-contract.ps1

      - name: Run tests
        run: >
          dotnet test KeelMatrix.FixtureVault.sln
          -c Release
          --no-restore
          --logger "trx;LogFileName=fixturevault-${{ matrix.os }}.trx"
          --results-directory ./artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: error

      - name: Pack tool
        run: >
          dotnet pack src/KeelMatrix.FixtureVault/KeelMatrix.FixtureVault.csproj
          -c Release
          --no-build
          --no-restore
          --include-symbols
          --p:SymbolPackageFormat=snupkg
          --output ./artifacts/packages

      - name: Test forbidden-file pack guard
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/test-pack-guard.ps1

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

      - name: Check for vulnerable dependencies
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/audit-vulnerabilities.ps1 -SolutionPath KeelMatrix.FixtureVault.sln

      - name: Test vulnerability audit fail-closed behavior
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/test-vulnerability-audit.ps1

  package-consumer-smoke:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.424"

      - name: Download packed tool
        uses: actions/download-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: ./artifacts/packages

      - name: Inspect package archive
        shell: pwsh
        run: |
          $package = Get-ChildItem -LiteralPath ./artifacts/packages -Filter "KeelMatrix.FixtureVault.0.1.0.nupkg" |
            Select-Object -First 1
          if ($null -eq $package) {
            throw "The packed FixtureVault 0.1.0 .nupkg was not found."
          }
          $symbols = Get-ChildItem -LiteralPath ./artifacts/packages -Filter "KeelMatrix.FixtureVault.0.1.0.snupkg" |
            Select-Object -First 1
          if ($null -eq $symbols) {
            throw "The packed FixtureVault 0.1.0 .snupkg was not found."
          }

          pwsh -NoProfile -File ./scripts/inspect-package.ps1 -PackagePath $package.FullName -SymbolsPackagePath $symbols.FullName -ExpectedVersion 0.1.0

      - name: Install and smoke-test packed tool
        shell: pwsh
        run: |
          $package = Get-ChildItem -LiteralPath ./artifacts/packages -Filter "KeelMatrix.FixtureVault.0.1.0.nupkg" |
            Select-Object -First 1
          if ($null -eq $package) {
            throw "The packed FixtureVault 0.1.0 .nupkg was not found."
          }

          pwsh -NoProfile -File ./scripts/package-consumer-smoke.ps1 -PackagePath $package.FullName -ExpectedVersion 0.1.0
