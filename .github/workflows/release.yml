name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  KEELMATRIX_NO_TELEMETRY: "1"

jobs:
  validate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Test release contract
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/test-release-contract.ps1

      - name: Validate release tag
        id: release-version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/validate-release-tag.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.424'

      - name: Restore from NuGet.org
        run: dotnet restore KeelMatrix.FixtureVault.sln --configfile NuGet.config --no-cache --force

      - name: Audit vulnerable dependencies
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/audit-vulnerabilities.ps1 -SolutionPath KeelMatrix.FixtureVault.sln

      - name: Build Release
        run: dotnet build KeelMatrix.FixtureVault.sln --configuration Release --no-restore -p:Version=${{ steps.release-version.outputs.version }}

      - name: Run tests
        run: dotnet test KeelMatrix.FixtureVault.sln --configuration Release --no-build --no-restore

      - name: Pack KeelMatrix.FixtureVault
        run: >
          dotnet pack src/KeelMatrix.FixtureVault/KeelMatrix.FixtureVault.csproj
          --configuration Release --no-build --no-restore
          --include-symbols --p:SymbolPackageFormat=snupkg
          -p:Version=${{ steps.release-version.outputs.version }}
          --output ./artifacts/packages

      - name: Validate release artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.release-version.outputs.version }}"
          $expected = @(
            "KeelMatrix.FixtureVault.$version.nupkg",
            "KeelMatrix.FixtureVault.$version.snupkg"
          ) | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath ./artifacts/packages -File | Select-Object -ExpandProperty Name | Sort-Object)
          if ((Compare-Object $expected $actual) -ne $null) {
            throw "Unexpected release artifact set. Expected: $($expected -join ', '). Actual: $($actual -join ', ')."
          }

      - name: Inspect release packages
        shell: pwsh
        run: |
          $version = "${{ steps.release-version.outputs.version }}"
          pwsh -NoProfile -File ./scripts/inspect-package.ps1 `
            -PackagePath "./artifacts/packages/KeelMatrix.FixtureVault.$version.nupkg" `
            -SymbolsPackagePath "./artifacts/packages/KeelMatrix.FixtureVault.$version.snupkg" `
            -ExpectedVersion $version

      - name: Smoke-test the release package
        shell: pwsh
        run: |
          $version = "${{ steps.release-version.outputs.version }}"
          pwsh -NoProfile -File ./scripts/package-consumer-smoke.ps1 `
            -PackagePath "./artifacts/packages/KeelMatrix.FixtureVault.$version.nupkg" `
            -ExpectedVersion $version

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-release-packages
          path: |
            ./artifacts/packages/KeelMatrix.FixtureVault.${{ steps.release-version.outputs.version }}.nupkg
            ./artifacts/packages/KeelMatrix.FixtureVault.${{ steps.release-version.outputs.version }}.snupkg
          if-no-files-found: error

  publish:
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@v7
        with:
          name: nuget-release-packages
          path: ./artifacts/packages

      - name: Validate downloaded artifact set
        shell: pwsh
        run: |
          $expected = @(
            "KeelMatrix.FixtureVault.0.1.0.nupkg",
            "KeelMatrix.FixtureVault.0.1.0.snupkg"
          ) | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath ./artifacts/packages -File | Select-Object -ExpandProperty Name | Sort-Object)
          if ((Compare-Object $expected $actual) -ne $null) {
            throw "Unexpected downloaded release artifact set. Expected: $($expected -join ', '). Actual: $($actual -join ', ')."
          }

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dmitriyzen

      - name: Push primary package to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./artifacts/packages/KeelMatrix.FixtureVault.0.1.0.nupkg `
            --source https://api.nuget.org/v3/index.json `
            --api-key $env:NUGET_API_KEY `
            --no-symbols
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Push symbols package to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./artifacts/packages/KeelMatrix.FixtureVault.0.1.0.snupkg `
            --source https://api.nuget.org/v3/index.json `
            --api-key $env:NUGET_API_KEY
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
